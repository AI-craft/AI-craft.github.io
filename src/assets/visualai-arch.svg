<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="26" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="13" font-weight="bold">VisualAI — ELK Stack Architecture (Original)</text>

  <!-- ── Production Line box ── -->
  <rect x="20" y="55" width="130" height="230" rx="6" fill="#0d1a2e" stroke="#334"/>
  <text x="85" y="76" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">PRODUCTION LINE</text>

  <rect x="32" y="85" width="106" height="38" rx="4" fill="#1a2236" stroke="#4fc3f7" stroke-width="1"/>
  <text x="85" y="100" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9">Control System</text>
  <text x="85" y="114" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="9">*.pfa files</text>

  <rect x="32" y="138" width="106" height="50" rx="4" fill="#1a2236" stroke="#666" stroke-width="1"/>
  <text x="85" y="153" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">Log Sources</text>
  <text x="85" y="167" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">PS Server</text>
  <text x="85" y="179" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">PDI Adapter · Illumination</text>

  <!-- ── Watchdog path ── -->
  <rect x="210" y="72" width="120" height="50" rx="5" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="270" y="92" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" font-weight="bold">Python</text>
  <text x="270" y="107" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" font-weight="bold">Watchdog</text>

  <rect x="210" y="142" width="120" height="38" rx="5" fill="#1a2236" stroke="#aaa" stroke-width="1"/>
  <text x="270" y="157" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">Beyond Compare 2</text>
  <text x="270" y="171" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">line-level diff</text>

  <!-- ── Filebeat / Logstash ── -->
  <rect x="210" y="215" width="120" height="36" rx="5" fill="#1a2236" stroke="#f0a500" stroke-width="1"/>
  <text x="270" y="230" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="10">Filebeat</text>
  <text x="270" y="244" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">WARN/ERROR/FATAL only</text>

  <rect x="385" y="215" width="110" height="36" rx="5" fill="#1a2236" stroke="#f0a500" stroke-width="1"/>
  <text x="440" y="230" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="10">Logstash</text>
  <text x="440" y="244" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">filter · transform</text>

  <!-- ── Elasticsearch ── -->
  <rect x="385" y="72" width="110" height="130" rx="6" fill="#1a2236" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="440" y="96" text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="11" font-weight="bold">Elasticsearch</text>
  <line x1="395" y1="105" x2="485" y2="105" stroke="#38ef7d" stroke-width="0.5" opacity="0.4"/>
  <text x="440" y="122" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">config_history-</text>
  <text x="440" y="134" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">YYYY-MM-DD</text>
  <text x="440" y="150" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">(daily rotated)</text>
  <text x="440" y="168" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">+ filtered log indices</text>
  <text x="440" y="182" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">port 9200</text>

  <!-- ── Kibana ── -->
  <rect x="560" y="100" width="110" height="72" rx="6" fill="#1a2236" stroke="#f06292" stroke-width="1.5"/>
  <text x="615" y="122" text-anchor="middle" fill="#f06292" font-family="monospace" font-size="11" font-weight="bold">Kibana</text>
  <text x="615" y="140" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">Dashboard</text>
  <text x="615" y="154" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">filter by linename</text>
  <text x="615" y="166" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">root cause analysis</text>

  <!-- Archive box -->
  <rect x="385" y="280" width="110" height="36" rx="5" fill="#111" stroke="#334" stroke-width="1"/>
  <text x="440" y="295" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">Archive Repository</text>
  <text x="440" y="308" text-anchor="middle" fill="#444" font-family="monospace" font-size="7">timestamped diffs</text>

  <!-- Arrows -->
  <!-- pfa → watchdog -->
  <line x1="138" y1="104" x2="208" y2="104" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- watchdog → beyond compare -->
  <line x1="270" y1="122" x2="270" y2="140" stroke="#4fc3f7" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- watchdog → elasticsearch (direct index) -->
  <line x1="330" y1="97" x2="383" y2="117" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="358" y="96" fill="#4fc3f7" font-family="monospace" font-size="7" text-anchor="middle">index</text>
  <!-- beyond compare → archive -->
  <line x1="270" y1="180" x2="270" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="270" y1="260" x2="383" y2="295" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <!-- logs → filebeat -->
  <line x1="138" y1="163" x2="208" y2="233" stroke="#f0a500" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- filebeat → logstash -->
  <line x1="330" y1="233" x2="383" y2="233" stroke="#f0a500" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- logstash → elasticsearch -->
  <line x1="440" y1="215" x2="440" y2="204" stroke="#f0a500" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- elasticsearch → kibana -->
  <line x1="495" y1="136" x2="558" y2="136" stroke="#38ef7d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="680" y="60" width="130" height="80" rx="4" fill="#0a0f1a" stroke="#222"/>
  <text x="745" y="76" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">STACK</text>
  <rect x="690" y="83" width="8" height="8" fill="#4fc3f7"/>
  <text x="704" y="91" fill="#4fc3f7" font-family="monospace" font-size="8">Python / Watchdog</text>
  <rect x="690" y="97" width="8" height="8" fill="#38ef7d"/>
  <text x="704" y="105" fill="#38ef7d" font-family="monospace" font-size="8">Elasticsearch</text>
  <rect x="690" y="111" width="8" height="8" fill="#f06292"/>
  <text x="704" y="119" fill="#f06292" font-family="monospace" font-size="8">Kibana</text>
  <rect x="690" y="125" width="8" height="8" fill="#f0a500"/>
  <text x="704" y="133" fill="#f0a500" font-family="monospace" font-size="8">Filebeat · Logstash</text>
</svg>
