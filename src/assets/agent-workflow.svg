<svg viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#4fc3f7"/>
    </marker>
    <marker id="r" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#f06060"/>
    </marker>
  </defs>

  <text x="410" y="22" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="12" font-weight="bold">MyWebPage Workflow — 7-Node LangGraph</text>

  <!-- Node boxes -->
  <!-- audit -->
  <rect x="18" y="60" width="90" height="50" rx="5" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="63" y="81" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" font-weight="bold">audit</text>
  <text x="63" y="96" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">DeepSeek</text>
  <text x="63" y="107" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">source → audit.md</text>

  <!-- brief -->
  <rect x="130" y="60" width="90" height="50" rx="5" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="175" y="81" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" font-weight="bold">brief</text>
  <text x="175" y="96" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">DeepSeek</text>
  <text x="175" y="107" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">audit → brief.md</text>

  <!-- checkpoint -->
  <rect x="242" y="60" width="100" height="50" rx="5" fill="#1a1a3e" stroke="#7c4dff" stroke-width="2"/>
  <text x="292" y="81" text-anchor="middle" fill="#7c4dff" font-family="monospace" font-size="10" font-weight="bold">checkpoint</text>
  <text x="292" y="96" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">Human-in-Loop</text>
  <text x="292" y="107" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">Telegram + popup</text>

  <!-- build -->
  <rect x="364" y="60" width="90" height="50" rx="5" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="409" y="81" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" font-weight="bold">build</text>
  <text x="409" y="96" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">DeepSeek</text>
  <text x="409" y="107" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">brief → HTML</text>

  <!-- card -->
  <rect x="476" y="60" width="90" height="50" rx="5" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="521" y="81" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" font-weight="bold">card</text>
  <text x="521" y="96" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">DeepSeek</text>
  <text x="521" y="107" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">index.html card</text>

  <!-- review -->
  <rect x="588" y="60" width="90" height="50" rx="5" fill="#1a2236" stroke="#f0a500" stroke-width="1.5"/>
  <text x="633" y="81" text-anchor="middle" fill="#f0a500" font-family="monospace" font-size="10" font-weight="bold">review</text>
  <text x="633" y="96" text-anchor="middle" fill="#777" font-family="monospace" font-size="8">rule-based</text>
  <text x="633" y="107" text-anchor="middle" fill="#555" font-family="monospace" font-size="7">QA checklist</text>

  <!-- repair -->
  <rect x="630" y="140" width="90" height="45" rx="5" fill="#1a1010" stroke="#f06060" stroke-width="1.5"/>
  <text x="675" y="160" text-anchor="middle" fill="#f06060" font-family="monospace" font-size="10" font-weight="bold">repair</text>
  <text x="675" y="175" text-anchor="middle" fill="#666" font-family="monospace" font-size="8">DeepSeek · max 3×</text>

  <!-- END -->
  <rect x="700" y="68" width="55" height="34" rx="5" fill="#0a2010" stroke="#38ef7d" stroke-width="1.5"/>
  <text x="727" y="90" text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="10" font-weight="bold">END</text>

  <!-- Main flow arrows -->
  <line x1="108" y1="85" x2="128" y2="85" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="85" x2="240" y2="85" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="342" y1="85" x2="362" y2="85" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="454" y1="85" x2="474" y2="85" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="566" y1="85" x2="586" y2="85" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="678" y1="85" x2="698" y2="85" stroke="#38ef7d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- repair loop -->
  <line x1="633" y1="110" x2="633" y2="138" stroke="#f06060" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#r)"/>
  <line x1="675" y1="140" x2="588" y2="110" stroke="#f06060" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#r)"/>
  <text x="620" y="134" fill="#f06060" font-family="monospace" font-size="7">issues</text>
  <text x="614" y="122" fill="#f06060" font-family="monospace" font-size="7">retry</text>
</svg>
