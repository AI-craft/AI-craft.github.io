<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" style="background:#0d1117">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4fc3f7"/>
    </marker>
  </defs>
  <!-- Boxes -->
  <rect x="20"  y="70" width="110" height="60" rx="6" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <rect x="185" y="70" width="110" height="60" rx="6" fill="#1a2236" stroke="#4fc3f7" stroke-width="1.5"/>
  <rect x="350" y="70" width="110" height="60" rx="6" fill="#1a2236" stroke="#38ef7d" stroke-width="1.5"/>
  <rect x="185" y="155" width="110" height="35" rx="6" fill="#1a2236" stroke="#888" stroke-width="1"/>
  <!-- Labels -->
  <text x="75"  y="97"  text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11">MPC</text>
  <text x="75"  y="113" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11">Controller</text>
  <text x="240" y="97"  text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11">Plant /</text>
  <text x="240" y="113" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="11">Process</text>
  <text x="405" y="97"  text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="11">Output</text>
  <text x="405" y="113" text-anchor="middle" fill="#38ef7d" font-family="monospace" font-size="11">y(t)</text>
  <text x="240" y="176" text-anchor="middle" fill="#aaa"    font-family="monospace" font-size="10">Feedback</text>
  <!-- Arrows: controller → plant -->
  <line x1="130" y1="100" x2="183" y2="100" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- plant → output -->
  <line x1="295" y1="100" x2="348" y2="100" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- output → feedback -->
  <line x1="405" y1="130" x2="405" y2="172" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="405" y1="172" x2="295" y2="172" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- feedback → controller -->
  <line x1="185" y1="172" x2="75"  y2="172" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="75"  y1="172" x2="75"  y2="132" stroke="#888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- setpoint input -->
  <line x1="0"   y1="100" x2="18"  y2="100" stroke="#f0a500" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="2" y="94" fill="#f0a500" font-family="monospace" font-size="9">r(t)</text>
  <!-- title -->
  <text x="300" y="25" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="13" font-weight="bold">Model Predictive Control</text>
  <text x="300" y="45" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">Predictive horizon · Constraint handling · Real-time optimisation</text>
</svg>
